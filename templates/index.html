<!DOCTYPE html>
<html>
<head>
    <title>Food Classifier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5 text-center">
        <div class="card p-5 shadow">
            <h1>🍽 Food Health Analysis</h1>
            <p>Upload a food image to see nutrition and health advice.</p>
            <form action="/predict" method="post" enctype="multipart/form-data" class="mt-4">
                <input type="file" name="file" class="form-control mb-3" required>
                <button type="submit" class="btn btn-success btn-lg">Analyze Now</button>
            </form>
        </div>
    </div>
</body>
</html>
